<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeSpeak · 生活英语</title>
<style>
:root{color-scheme:light;--ink:#193947;--muted:#566b75;--blue:#155bbc;--paper:#f3f7fb;--line:#dbe5ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,.upload{cursor:pointer;background:white;border:1px solid var(--line);padding:10px 16px;border-radius:9px;color:var(--ink)}button:hover,.upload:hover{border-color:var(--blue)}:focus-visible{outline:3px solid #e3a22d;outline-offset:3px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}header{padding:22px 5vw;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-size:25px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--blue)}.sub{color:var(--muted);font-size:14px}.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}main{max-width:1180px;margin:auto;padding:30px 24px 70px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}h1{font-size:clamp(28px,4vw,42px);margin:0;font-weight:650;letter-spacing:-1px}h2{font-size:23px;margin:0 0 18px}p{max-width:72ch}.status{color:var(--muted);margin:8px 0}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:26px;padding:4px}.tabs button{white-space:nowrap;background:transparent;border-color:transparent}.tabs button[aria-selected=true]{background:white;color:var(--blue);border-color:var(--line)}.panel{background:white;border:1px solid var(--line);padding:26px;border-radius:15px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.stripe{border-left:4px solid #3286df;padding-left:22px;margin:22px 0}.big{font-size:32px;font-weight:650}.stats{display:flex;gap:35px;flex-wrap:wrap;margin:26px 0}.small{font-size:14px;color:var(--muted)}.row{padding:15px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.row:last-child{border:0}.pill{font-size:13px;background:#edf4ff;color:#225ea6;padding:4px 10px;border-radius:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.sentence{font:clamp(23px,3vw,32px)/1.5 Georgia,serif;padding:22px 0}.hidden,[hidden]{display:none!important}label{display:inline-block}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}select,input[type=search],textarea{max-width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}textarea{width:100%;min-height:85px;font:inherit}progress{width:100%;height:9px;accent-color:var(--blue)}#notice{min-height:26px;color:#285d42}article{font:22px/1.85 Georgia,serif;max-width:65ch}footer{font-size:13px;color:var(--muted);margin-top:25px}@media(max-width:740px){.grid{grid-template-columns:1fr}.tools{margin-left:0}.intro{display:block}.panel{padding:20px}main{padding:22px 16px}.stats{gap:20px}header{padding:18px}.tabs{margin-left:-5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<header><div class="brand">Life<span>Speak</span></div><span class="sub">把学过的英语，用到生活里</span><div class="tools"><label class="upload">导入学习表<input id="excel" type="file" accept=".xlsx" hidden></label><button id="backup">导出备份</button><label class="upload">恢复备份<input id="restore" type="file" accept=".json" hidden></label></div></header>
<main><div class="intro"><div><p class="small">我的英语学习空间</p><h1 id="headline">今天，从这里继续。</h1><p class="status" id="source">导入最新学习表，课程和记录就会显示在这里。</p></div><span class="pill">A1 生活英语</span></div><div id="notice" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="学习栏目"><button data-tab="today" aria-selected="true">今日学习</button><button data-tab="speaking" aria-selected="false">晚间听说</button><button data-tab="reading" aria-selected="false">阅读练习</button><button data-tab="words" aria-selected="false">词句与预习</button><button data-tab="history" aria-selected="false">学习记录</button></nav><section id="view"></section>
<footer>学习数据仅保存在当前浏览器，不会上传 GitHub。换设备请导出并恢复备份；尚未接入自动云同步。网页练习记录与原 Excel 分开保存，不会自动修改原表。请定期备份。</footer></main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), key='lifespeak-v1';
let state={sheets:{},marks:{},answers:{},sessions:[],name:''},tab='today',index=0,scope='day',running=false,start=0,elapsed=0;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.sheets&&saved.marks&&saved.answers&&Array.isArray(saved.sessions))state=saved}catch(e){$('notice').textContent='上次缓存无法读取，请重新导入学习表。'}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('notice').textContent='浏览器保存失败，请立即导出备份。'}}
function msg(s){$('notice').textContent=s}function rows(n){return state.sheets[n]||[]}function cell(n,r,c){return rows(n)[r-1]?.[c-1]??''}
function details(){return rows('练习明细').filter(r=>r[3]&&r[4]==='文字')}
function latest(){return details().map(r=>String(r[0])).sort().at(-1)||''}
function items(){const all=details(),day=latest();return all.filter(r=>scope==='week'?String(r[1])===String(all.find(x=>String(x[0])===day)?.[1]):String(r[0])===day)}
function marked(r,kind){const m=state.marks[r[3]]||{};const col=scope==='week'?(kind==='hear'?11:12):(kind==='hear'?9:10);return m[scope+kind]??(kind==='hear'?r[col]==='已听':['首答正确','提示后完成'].includes(r[col]))}
function switchTab(t){tab=t;index=0;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));render()}
function render(){const loaded=!!state.name;$('source').textContent=loaded?'已导入 '+state.name+' · 练习日期 '+latest():'尚未导入学习表 · 阅读区提供一篇未计入成绩的补充材料';$('headline').textContent=loaded?'继续你的生活英语。':'今天，从这里继续。';const v=$('view');if(tab==='today'){v.innerHTML=`<div class="grid"><div class="panel"><h2>下一步学什么</h2><div class="stripe"><p>${esc(cell('今日学习',4,1)||'先导入最新 Excel 学习表')}</p><div class="big">${esc(cell('今日学习',6,3)||'课程随记录更新')}</div><p>${esc(cell('今日学习',7,3)||'支持课程计划、学习记录、词句库和逐题听说清单。')}</p></div><button class="primary" id="go">开始晚间听说</button></div><aside class="panel"><h2>学习节奏</h2><p>白天：词句应用、阅读和任务练习，答对的不机械重复。</p><p>晚上：完整听说当天内容，固定15分钟，未完成的保留待补。</p><p>周末：完整覆盖本周内容，错项隔开复测。</p><p class="small">预习只作接触，不直接计为掌握。</p></aside></div><div class="panel"><h2>你的进度</h2><div class="stats"><div><div class="big">${esc(cell('今日学习',8,3)||'—')}</div><span class="small">表中累计分钟</span></div><div><div class="big">${details().length}</div><span class="small">文字练习条目</span></div><div><div class="big">${state.sessions.length}</div><span class="small">本站已保存练习段</span></div></div><p class="small">本站练习时间单独记录，避免与 Excel 累计重复计算。</p></div>`;$('go').onclick=()=>switchTab('speaking')}
if(tab==='speaking')renderSpeaking();
if(tab==='reading')renderReading();
if(tab==='words'||tab==='history'){const name=tab==='words'?'词句库':'学习记录';v.innerHTML=`<div class="panel"><h2>${name}</h2><label>查找内容 <input id="search" type="search" placeholder="输入英文或中文"></label><div id="list"></div></div>`;const draw=()=>{const q=$('search').value.toLowerCase();$('list').innerHTML=rows(name).filter(r=>r.some(x=>String(x??'').toLowerCase().includes(q))).map(r=>`<div class="row">${r.filter(x=>x!==null&&x!=='').map(x=>esc(x)).join('　 /　 ')}</div>`).join('')||'<p>导入学习表后查看。</p>'};$('search').oninput=draw;draw();if(tab==='history')$('list').insertAdjacentHTML('afterbegin',state.sessions.map(s=>`<div class="row">本站练习：${esc(s.date)}，${Math.round(s.seconds/60*10)/10}分钟，${esc(s.scope)}，${s.covered}/${s.total}已开口</div>`).join(''))}}
function renderSpeaking(){const arr=items();index=Math.min(index,Math.max(0,arr.length-1));const r=arr[index],done=arr.filter(x=>marked(x,'speak')).length;$('view').innerHTML=`<div class="panel"><div class="intro"><h2>把会写的，练成会说的。</h2><label>覆盖范围 <select id="scope"><option value="day" ${scope==='day'?'selected':''}>最新学习日</option><option value="week" ${scope==='week'?'selected':''}>最新学习周</option></select></label></div><progress value="${done}" max="${arr.length||1}"></progress><p class="small">已开口 ${done} / ${arr.length} · 剩余 ${arr.length-done} 条</p><div class="actions"><button id="timer" class="primary">${running?'暂停计时':'开始／继续15分钟'}</button><span class="big" id="clock"></span><button id="finish">保存本次练习</button></div></div><div class="panel">${r?`<span class="pill">${index+1} / ${arr.length} · ${esc(r[3])}</span><h2 class="sentence">${esc(r[5])}</h2><button id="listen">听参考表达</button> <button id="reveal">查看参考表达</button><p id="answer" class="sentence" hidden>${esc(r[7]||r[6])}</p><p class="small">参考表达不是唯一正确答案。网页不自动判断口语成绩。</p><label><input id="hear" type="checkbox" ${marked(r,'hear')?'checked':''}>已听并理解</label>　<label><input id="speak" type="checkbox" ${marked(r,'speak')?'checked':''}>已实际开口</label><div class="actions"><button id="prev" ${index===0?'disabled':''}>上一条</button><button id="next" ${index===arr.length-1?'disabled':''}>下一条</button><button id="pending">转到待补</button></div>`:'<h2>听说清单等待导入</h2><p>请先导入包含「练习明细」的最新学习表。</p>'}</div>`;$('scope').onchange=e=>{scope=e.target.value;index=0;render()};$('timer').onclick=()=>{if(running){elapsed+=Date.now()-start;running=false}else if(elapsed>=900000){msg('15分钟已到，请保存本次练习。')}else{running=true;start=Date.now()}render()};$('finish').onclick=()=>{const ms=time();if(ms<1000)return msg('尚未开始实际计时。');state.sessions.push({date:new Date().toISOString(),seconds:Math.round(ms/1000),scope:scope==='day'?'当天':'本周',covered:done,total:arr.length});running=false;elapsed=0;save();render();msg(`已保存本次实际练习，剩余 ${arr.length-done} 条待补。`)};if(r){$('reveal').onclick=()=>{$('answer').hidden=!$('answer').hidden};$('listen').onclick=()=>{if(!('speechSynthesis'in window))return msg('当前浏览器不支持朗读。');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(r[7]||r[6]));u.lang=/[\u4e00-\u9fff]/.test(u.text)?'zh-CN':'en-US';u.rate=.8;speechSynthesis.speak(u)};for(const [id,kind]of[['hear','hear'],['speak','speak']])$(id).onchange=e=>{(state.marks[r[3]]??={})[scope+kind]=e.target.checked;save();render()};$('prev').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};$('pending').onclick=()=>{const found=arr.findIndex((x,i)=>i>index&&!marked(x,'speak'));index=found>=0?found:arr.findIndex(x=>!marked(x,'speak'));if(index<0){index=0;msg('全部条目已开口。')}render()}}tick()}
function time(){return elapsed+(running?Date.now()-start:0)}function tick(){const ms=time();if(running&&ms>=900000){elapsed=ms;running=false;msg('15分钟已到。请保存本次练习，未覆盖内容保留待补。');if(tab==='speaking')$('timer').textContent='15分钟已到'}if($('clock')){const s=Math.max(0,Math.ceil((900000-time())/1000));$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}setInterval(tick,1000);
const questions=[['What time does Ben wake up?','At seven.'],['Does Ben always leave home at eight?','No, he doesn’t. Sometimes he leaves at half past eight.'],['Where does he go after work?','He sometimes goes to a café.']];let qi=0;
function renderReading(){$('view').innerHTML=`<div class="panel"><span class="pill">补充阅读 · 未计入已学记录</span><h2>Ben’s working day</h2><article>Ben usually wakes up at seven and gets up at half past seven. He has breakfast at home. He usually leaves home at eight, but sometimes he leaves at half past eight. He gets off work at half past six. After work, he sometimes goes to a café. He pays by card and asks for a receipt. He doesn’t always get home at seven.</article><p class="small">旧词自然复现：breakfast、café、card、receipt。wake up 是醒来，get up 是起床。</p></div><div class="panel"><h2>理解题 ${qi+1} / 3</h2><p>${questions[qi][0]}</p><label for="response">你的回答</label><textarea id="response" placeholder="先回答，再核对参考答案"></textarea><div class="actions"><button id="check">保存回答并看参考</button><button id="readNext">${qi===2?'回到第一题':'下一题'}</button></div><p id="feedback" role="status"></p></div>`;$('response').value=state.answers['reading-'+qi]||'';$('check').onclick=()=>{if(!$('response').value.trim())return msg('请先写下你的回答。');state.answers['reading-'+qi]=$('response').value;save();$('feedback').textContent='参考：'+questions[qi][1]+'（可用其他有效表达，自行核对，未自动评分）'};$('readNext').onclick=()=>{state.answers['reading-'+qi]=$('response').value;save();qi=(qi+1)%3;renderReading()}}
function download(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='LifeSpeak-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('backup').onclick=download;
$('excel').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!window.XLSX)throw Error('Excel 组件未加载，请联网刷新后重试。');const w=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});if(!w.Sheets['今日学习']||!w.Sheets['练习明细'])throw Error('请选择包含「今日学习」与「练习明细」的学习主表。');const sheets={};for(const n of w.SheetNames)sheets[n]=XLSX.utils.sheet_to_json(w.Sheets[n],{header:1,defval:null}).map(r=>r.map(x=>x instanceof Date?`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`:x));state.sheets=sheets;state.name=f.name;save();render();msg('已导入学习表，历史逐题标记继续保留。')}catch(err){msg(err.message)}e.target.value=''};
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s||typeof s.sheets!=='object'||!s.sheets||!s.marks||!s.answers||!Array.isArray(s.sessions))throw Error('备份格式不正确。');download();state=s;save();render();msg('已恢复备份；恢复前的数据已自动导出备份。')}catch(err){msg('恢复失败：'+err.message)}e.target.value=''};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));render();
</script></html>
